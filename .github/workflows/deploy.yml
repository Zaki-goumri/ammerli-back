name: Deploy to VPS

on:
  workflow_run:
    workflows: ["Build & Push to GHCR"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          envs: GITHUB_TOKEN,GITHUB_ACTOR
          script_stop: true
          script: |
            set -e
            
            echo "🚀 Starting deployment..."
            
            # Navigate to project directory
            cd /root/ammerli || { echo "❌ Project directory not found"; exit 1; }
            
            # Login to GHCR
            echo "🔐 Authenticating with GitHub Container Registry..."
            echo $GITHUB_TOKEN | docker login ghcr.io -u $GITHUB_ACTOR --password-stdin

            # Set environment variables
            export NODE_ENV=prod
            export SERVER_IMAGE=ghcr.io/${{ github.repository }}:latest
            export MINIO_IMAGE=ghcr.io/${{ github.repository }}-minio:latest
            
            # Pull latest images
            echo "📥 Pulling latest images..."
            docker compose pull
            
            # Health check before stopping
            echo "🏥 Running pre-deployment health check..."
            if ! curl -f http://localhost:3000/health 2>/dev/null; then
              echo "⚠️  Warning: Health check failed, but continuing..."
            fi
            
            # Stop old containers gracefully
            echo "🛑 Stopping old containers..."
            docker compose down --timeout 30
            
            # Start new containers
            echo "🚀 Starting new containers..."
            docker compose up -d
            
            # Wait for containers to be ready
            echo "⏳ Waiting for containers to start..."
            sleep 10
            
            # Run database migrations
            # echo "🗄️  Running database migrations..."
            # if ! docker compose exec -T server pnpm run migration:run; then
            #   echo "❌ Migration failed! Rolling back..."
            #   docker compose down
            #   docker compose up -d
            #   echo "⚠️  Deployment rolled back due to migration failure"
            #   exit 1
            # fi
            
            # Health check after deployment
            echo "🏥 Running post-deployment health check..."
            RETRY_COUNT=0
            MAX_RETRIES=12
            
            while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
              if curl -f http://localhost:3000/health 2>/dev/null; then
                echo "✅ Health check passed!"
                break
              fi
              RETRY_COUNT=$((RETRY_COUNT + 1))
              echo "⏳ Waiting for service to be ready... ($RETRY_COUNT/$MAX_RETRIES)"
              sleep 5
            done
            
            if [ $RETRY_COUNT -eq $MAX_RETRIES ]; then
              echo "❌ Health check failed after deployment!"
              echo "📋 Container logs:"
              docker compose logs --tail=50 server
              exit 1
            fi
            
            # Clean up old images
            echo "🧹 Cleaning up old images..."
            docker image prune -f
            
            echo "✅ Deployment completed successfully!"

      - name: Deployment notification
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "## ✅ Deployment Successful" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "🎉 Application deployed to production!" >> $GITHUB_STEP_SUMMARY
            echo "🌐 URL: https://api.ammerli.com" >> $GITHUB_STEP_SUMMARY
          else
            echo "## ❌ Deployment Failed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "⚠️  Deployment was rolled back due to errors." >> $GITHUB_STEP_SUMMARY
            echo "Check the logs above for details." >> $GITHUB_STEP_SUMMARY
          fi
