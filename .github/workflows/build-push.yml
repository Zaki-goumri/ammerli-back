name: Build & Push to GHCR

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/workflows/codeql.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  BASE_IMAGE_NAME: ghcr.io/${{ github.repository }}-base
  PROD_IMAGE_NAME: ghcr.io/${{ github.repository }}
  MINIO_IMAGE_NAME: ghcr.io/${{ github.repository }}-minio

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push base image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.base
          push: true
          tags: |
            ${{ env.BASE_IMAGE_NAME }}:latest
            ${{ env.BASE_IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.BASE_IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.BASE_IMAGE_NAME }}:buildcache,mode=max

      - name: Build and push production image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.prod
          push: true
          tags: |
            ${{ env.PROD_IMAGE_NAME }}:latest
            ${{ env.PROD_IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.PROD_IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.PROD_IMAGE_NAME }}:buildcache,mode=max
          build-args: |
            BASE_IMAGE=${{ env.BASE_IMAGE_NAME }}:latest

      - name: Build and push MinIO image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.minio
          push: true
          tags: |
            ${{ env.MINIO_IMAGE_NAME }}:latest
            ${{ env.MINIO_IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.MINIO_IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.MINIO_IMAGE_NAME }}:buildcache,mode=max

      - name: Generate build summary
        run: |
          echo "## 🎉 Build Successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Images Published" >> $GITHUB_STEP_SUMMARY
          echo "- 📦 Base: \`${{ env.BASE_IMAGE_NAME }}:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- 🚀 Production: \`${{ env.PROD_IMAGE_NAME }}:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- 💾 MinIO: \`${{ env.MINIO_IMAGE_NAME }}:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
