services:
  traefik:
    image: traefik:v3.2
    container_name: traefik
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/traefik.yml:ro
      - ./traefik/config.yml:/config.yml:ro
      - ./traefik/acme.json:/acme.json
      - ./traefik/logs:/var/log:rw
    networks:
      - proxy
      - internal
    labels:
      - "traefik.enable=true"
      # Dashboard router
      - "traefik.http.routers.traefik-dashboard.rule=Host(`traefik.ammerli.com`)"
      - "traefik.http.routers.traefik-dashboard.entrypoints=websecure"
      - "traefik.http.routers.traefik-dashboard.service=api@internal"
      - "traefik.http.routers.traefik-dashboard.tls=true"
      - "traefik.http.routers.traefik-dashboard.tls.certresolver=letsencrypt"
      - "traefik.http.routers.traefik-dashboard.middlewares=security-headers@file"
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"
        compress: "true"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 256M
        reservations:
          cpus: '0.5'
          memory: 128M
    environment:
      - TZ=Africa/Algiers
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  server:
    # REMOVED: container_name (required for scaling)
    image: zakigoumri/3ammerli-backend:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
    networks:
      - proxy
      - internal
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      
      # ==================================
      # RATE LIMITING (Optimized)
      # ==================================
      - "traefik.http.middlewares.api-ratelimit-ip.ratelimit.average=500"
      - "traefik.http.middlewares.api-ratelimit-ip.ratelimit.period=1m"
      - "traefik.http.middlewares.api-ratelimit-ip.ratelimit.burst=250"
      - "traefik.http.middlewares.api-ratelimit-ip.ratelimit.sourceCriterion.requestHeaderName=X-Forwarded-For"
      
      - "traefik.http.middlewares.api-ratelimit-subnet.ratelimit.average=800"
      - "traefik.http.middlewares.api-ratelimit-subnet.ratelimit.period=1m"
      - "traefik.http.middlewares.api-ratelimit-subnet.ratelimit.burst=400"
      - "traefik.http.middlewares.api-ratelimit-subnet.ratelimit.sourceCriterion.ipStrategy.depth=1"
      
      # ==================================
      # PERFORMANCE MIDDLEWARES
      # ==================================
      - "traefik.http.middlewares.api-compress.compress=true"
      
      - "traefik.http.middlewares.api-buffer.buffering.maxRequestBodyBytes=10485760"
      - "traefik.http.middlewares.api-buffer.buffering.memRequestBodyBytes=2097152"
      - "traefik.http.middlewares.api-buffer.buffering.maxResponseBodyBytes=10485760"
      - "traefik.http.middlewares.api-buffer.buffering.memResponseBodyBytes=2097152"
      
      - "traefik.http.middlewares.api-inflightreq.inflightreq.amount=500"
      - "traefik.http.middlewares.api-inflightreq.inflightreq.sourceCriterion.requestHeaderName=X-Forwarded-For"
      
      - "traefik.http.middlewares.api-circuitbreaker.circuitbreaker.expression=NetworkErrorRatio() > 0.30"
      
      - "traefik.http.middlewares.api-retry.retry.attempts=3"
      - "traefik.http.middlewares.api-retry.retry.initialinterval=100ms"
      
      # ==================================
      # HTTP ROUTER (redirect to HTTPS)
      # ==================================
      - "traefik.http.routers.server.rule=Host(`api.ammerli.com`)"
      - "traefik.http.routers.server.entrypoints=web"
      - "traefik.http.routers.server.service=server"
      - "traefik.http.routers.server.middlewares=https-redirect@file"
      
      # ==================================
      # HTTPS ROUTER (with all middlewares)
      # ==================================
      - "traefik.http.routers.server-secure.rule=Host(`api.ammerli.com`)"
      - "traefik.http.routers.server-secure.entrypoints=websecure"
      - "traefik.http.routers.server-secure.service=server"
      - "traefik.http.routers.server-secure.tls=true"
      - "traefik.http.routers.server-secure.tls.certresolver=letsencrypt"
      - "traefik.http.routers.server-secure.middlewares=api-ratelimit-ip,api-ratelimit-subnet,api-compress,api-buffer,api-inflightreq,api-retry,security-headers@file"
      
      # ==================================
      # SERVICE DEFINITION & LOAD BALANCING
      # ==================================
      - "traefik.http.services.server.loadbalancer.server.port=3000"
      
      # Load Balancing Algorithm
      - "traefik.http.services.server.loadbalancer.sticky.cookie=true"
      - "traefik.http.services.server.loadbalancer.sticky.cookie.name=server_sticky"
      - "traefik.http.services.server.loadbalancer.sticky.cookie.secure=true"
      - "traefik.http.services.server.loadbalancer.sticky.cookie.httpOnly=true"
      - "traefik.http.services.server.loadbalancer.sticky.cookie.sameSite=lax"
      
      # Health Check Configuration
      - "traefik.http.services.server.loadbalancer.healthcheck.path=/health"
      - "traefik.http.services.server.loadbalancer.healthcheck.interval=30s"
      - "traefik.http.services.server.loadbalancer.healthcheck.timeout=5s"
      - "traefik.http.services.server.loadbalancer.healthcheck.scheme=http"
      - "traefik.http.services.server.loadbalancer.healthcheck.followredirects=false"
      
      # Connection Settings
      - "traefik.http.services.server.loadbalancer.passhostheader=true"
      - "traefik.http.services.server.loadbalancer.responseforwarding.flushinterval=100ms"
      
    env_file:
      - .env
    environment:
      # Node.js Optimizations
      - NODE_OPTIONS=--max-old-space-size=768 --max-http-header-size=16384
      - UV_THREADPOOL_SIZE=128
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"
        compress: "true"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 768M
        reservations:
          cpus: '0.5'
          memory: 512M

  minio:
    image: minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BROWSER_REDIRECT_URL: https://minio.ammerli.com
      MINIO_SERVER_URL: https://storage.ammerli.com
      MINIO_API_REQUESTS_MAX: 1600
      MINIO_API_REQUESTS_DEADLINE: 10s
      MINIO_CACHE_SIZE: 8000
    volumes:
      - minio-data:/data
    networks:
      - proxy
      - internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"
        compress: "true"
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      
      - "traefik.http.middlewares.storage-ratelimit-ip.ratelimit.average=300"
      - "traefik.http.middlewares.storage-ratelimit-ip.ratelimit.period=1m"
      - "traefik.http.middlewares.storage-ratelimit-ip.ratelimit.burst=150"
      - "traefik.http.middlewares.storage-ratelimit-ip.ratelimit.sourceCriterion.requestHeaderName=X-Forwarded-For"
      
      - "traefik.http.middlewares.storage-ratelimit-subnet.ratelimit.average=500"
      - "traefik.http.middlewares.storage-ratelimit-subnet.ratelimit.period=1m"
      - "traefik.http.middlewares.storage-ratelimit-subnet.ratelimit.burst=250"
      - "traefik.http.middlewares.storage-ratelimit-subnet.ratelimit.sourceCriterion.ipStrategy.depth=1"
      
      - "traefik.http.middlewares.minio-console-ratelimit.ratelimit.average=50"
      - "traefik.http.middlewares.minio-console-ratelimit.ratelimit.period=1m"
      - "traefik.http.middlewares.minio-console-ratelimit.ratelimit.burst=25"
      
      # MinIO API (Secure)
      - "traefik.http.routers.minio-api.rule=Host(`storage.ammerli.com`)"
      - "traefik.http.routers.minio-api.entrypoints=websecure"
      - "traefik.http.routers.minio-api.tls=true"
      - "traefik.http.routers.minio-api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.minio-api.middlewares=storage-ratelimit-ip,storage-ratelimit-subnet"
      - "traefik.http.routers.minio-api.service=minio-api"
      - "traefik.http.services.minio-api.loadbalancer.server.port=9000"

      # MinIO API (HTTP to HTTPS Redirect)
      - "traefik.http.routers.minio-api-http.rule=Host(`storage.ammerli.com`)"
      - "traefik.http.routers.minio-api-http.entrypoints=web"
      - "traefik.http.routers.minio-api-http.middlewares=https-redirect@file"
      
      # MinIO Console (Secure)
      - "traefik.http.routers.minio-console.rule=Host(`minio.ammerli.com`)"
      - "traefik.http.routers.minio-console.entrypoints=websecure"
      - "traefik.http.routers.minio-console.tls=true"
      - "traefik.http.routers.minio-console.tls.certresolver=letsencrypt"
      - "traefik.http.routers.minio-console.middlewares=minio-console-ratelimit"
      - "traefik.http.routers.minio-console.service=minio-console"
      - "traefik.http.services.minio-console.loadbalancer.server.port=9001"

      # MinIO Console (HTTP to HTTPS Redirect)
      - "traefik.http.routers.minio-console-http.rule=Host(`minio.ammerli.com`)"
      - "traefik.http.routers.minio-console-http.entrypoints=web"
      - "traefik.http.routers.minio-console-http.middlewares=https-redirect@file"

  redis:
    image: redis:7.4-alpine
    container_name: redis
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --maxmemory-policy noeviction
      --maxmemory-policy noeviction
      --save ""
      --appendonly no
      --tcp-backlog 511
      --timeout 0
      --tcp-keepalive 300
    networks:
      - internal
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"
        compress: "true"
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  db:
    image: postgres:18-alpine
    container_name: db
    restart: unless-stopped
    ports:
      - "5432:5432"
    user: postgres
    env_file:
      - .env
    volumes:
      - db-data:/var/lib/postgresql/data
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=2GB"
      - "-c"
      - "effective_cache_size=6GB"
      - "-c"
      - "work_mem=32MB"
      - "-c"
      - "maintenance_work_mem=512MB"
      - "-c"
      - "max_connections=250"
      - "-c"
      - "max_wal_size=2GB"
      - "-c"
      - "min_wal_size=1GB"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "wal_buffers=16MB"
      - "-c"
      - "default_statistics_target=100"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "effective_io_concurrency=200"
      - "-c"
      - "max_worker_processes=4"
      - "-c"
      - "max_parallel_workers_per_gather=2"
      - "-c"
      - "max_parallel_workers=4"
      - "-c"
      - "max_parallel_maintenance_workers=2"
    networks:
      - internal
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"
        compress: "true"
    deploy:
      resources:
        limits:
          memory: 3G
        reservations:
          memory: 2G

  pgbouncer:
    image: edoburu/pgbouncer:v1.23.1-p3
    container_name: pgbouncer
    restart: unless-stopped
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      LISTEN_PORT: ${DB_PGBOUNCER_PORT}
      AUTH_TYPE: scram-sha-256
      AUTH_QUERY: "SELECT usename, passwd FROM pg_shadow WHERE usename=$1"
      POOL_MODE: ${POOL_MODE:-transaction}
      MAX_CLIENT_CONN: ${MAX_CLIENT_CONN:-8000}
      DEFAULT_POOL_SIZE: ${DEFAULT_POOL_SIZE:-200}
      SERVER_IDLE_TIMEOUT: 600
      SERVER_LIFETIME: 3600
      SERVER_CONNECT_TIMEOUT: 15
      QUERY_TIMEOUT: 0
      CLIENT_IDLE_TIMEOUT: 0
    ports:
      - "${DB_PGBOUNCER_PORT}:${DB_PGBOUNCER_PORT}"
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=${DB_PASSWORD} psql -h 127.0.0.1 -p ${DB_PGBOUNCER_PORT} -U ${DB_USERNAME} -d ${DB_NAME} -c 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"
        compress: "true"

  db-backup:
    image: prodrigestivill/postgres-backup-local:16-alpine
    container_name: db-backup
    restart: unless-stopped
    depends_on:
      - db
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - SCHEDULE=@daily
      - BACKUP_KEEP_DAYS=7
      - HEALTHCHECK_PORT=8080
    volumes:
      - backups:/backups
    networks:
      - internal
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"
        compress: "true"

  loki:
    image: grafana/loki:2.9.10
    container_name: loki
    ports:
      - "3100:3100"
    volumes:
      - ./loki-config.yaml:/etc/loki/loki-config.yml
      - loki-data:/loki
    command: -config.file=/etc/loki/loki-config.yml
    networks:
      - proxy
      - internal
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"
        compress: "true"

  grafana:
    image: grafana/grafana:10.2.3
    container_name: grafana
    depends_on:
      - loki
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=https://grafana.ammerli.com
      - GF_SERVER_DOMAIN=grafana.ammerli.com
    networks:
      - proxy
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      
      - "traefik.http.middlewares.grafana-ratelimit.ratelimit.average=100"
      - "traefik.http.middlewares.grafana-ratelimit.ratelimit.period=1m"
      - "traefik.http.middlewares.grafana-ratelimit.ratelimit.burst=50"
      
      - "traefik.http.routers.grafana.rule=Host(`grafana.ammerli.com`)"
      - "traefik.http.routers.grafana.entrypoints=web"
      - "traefik.http.routers.grafana.service=grafana"
      - "traefik.http.routers.grafana.middlewares=https-redirect@file"
      
      - "traefik.http.routers.grafana-secure.rule=Host(`grafana.ammerli.com`)"
      - "traefik.http.routers.grafana-secure.entrypoints=websecure"
      - "traefik.http.routers.grafana-secure.service=grafana"
      - "traefik.http.routers.grafana-secure.tls=true"
      - "traefik.http.routers.grafana-secure.tls.certresolver=letsencrypt"
      - "traefik.http.routers.grafana-secure.middlewares=grafana-ratelimit,security-headers@file"
      
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"
        compress: "true"

# ==============================================
# NETWORK CONFIGURATION (Optimized)
# ==============================================
networks:
  proxy:
    name: proxy
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: "1500"
      com.docker.network.bridge.name: "docker-proxy"
      com.docker.network.bridge.enable_ip_masquerade: "true"
      com.docker.network.bridge.enable_icc: "true"
    ipam:
      driver: default
      config:
        - subnet: 172.20.0.0/16
          gateway: 172.20.0.1
  
  internal:
    name: internal
    driver: bridge
    internal: true
    driver_opts:
      com.docker.network.driver.mtu: "1500"
      com.docker.network.bridge.name: "docker-internal"
      com.docker.network.bridge.enable_icc: "true"
    ipam:
      driver: default
      config:
        - subnet: 172.21.0.0/16
          gateway: 172.21.0.1

volumes:
  minio-data:
    driver: local
  db-data:
    driver: local
  backups:
    driver: local
  loki-data:
    driver: local
  grafana-data:
    driver: local
