services:
  traefik:
    image: traefik:latest
    container_name: traefik
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080" 
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/traefik.yml:ro
      - ./traefik/acme.json:/acme.json
      - ./traefik/config.yml:/config.yml:ro
    networks:
      - proxy
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik.rule=Host(`traefik.localhost`)"
      - "traefik.http.routers.traefik.service=api@internal"
      - "traefik.http.routers.traefik.entrypoints=web"

  server:
    container_name: server
    image: zakigoumri/3ammerli-backend:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "3000:3000"
      - "8000:8000"
      - "8008:8008"
    networks:
      - proxy
      - internal
    healthcheck:
      test: ["CMD", "pm2", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      
      # Per-IP Rate limiting middleware (Traefik Layer 1)
      - "traefik.http.middlewares.api-ratelimit-ip.ratelimit.average=${TRAEFIK_RATE_LIMIT_AVERAGE:-100}"
      - "traefik.http.middlewares.api-ratelimit-ip.ratelimit.period=${TRAEFIK_RATE_LIMIT_PERIOD:-1m}"
      - "traefik.http.middlewares.api-ratelimit-ip.ratelimit.burst=${TRAEFIK_RATE_LIMIT_BURST:-50}"
      - "traefik.http.middlewares.api-ratelimit-ip.ratelimit.sourceCriterion.requestHeaderName=X-Forwarded-For"
      
      # Per-Subnet Rate limiting middleware (Traefik Layer 1 - Subnet)
      # Note: Traefik groups by /24 automatically when using depth strategy
      - "traefik.http.middlewares.api-ratelimit-subnet.ratelimit.average=${TRAEFIK_SUBNET_RATE_LIMIT_AVERAGE:-150}"
      - "traefik.http.middlewares.api-ratelimit-subnet.ratelimit.period=${TRAEFIK_SUBNET_RATE_LIMIT_PERIOD:-1m}"
      - "traefik.http.middlewares.api-ratelimit-subnet.ratelimit.burst=${TRAEFIK_SUBNET_RATE_LIMIT_BURST:-50}"
      - "traefik.http.middlewares.api-ratelimit-subnet.ratelimit.sourceCriterion.ipStrategy.depth=1"
      
      # HTTP router (redirects to HTTPS)
      - "traefik.http.routers.server.rule=Host(`api.ammerli.com`)"
      - "traefik.http.routers.server.entrypoints=web"
      
      # HTTPS router with both rate limiters
      - "traefik.http.routers.server-secure.rule=Host(`api.ammerli.com`)"
      - "traefik.http.routers.server-secure.entrypoints=websecure"
      - "traefik.http.routers.server-secure.tls=true"
      - "traefik.http.routers.server-secure.tls.certresolver=letsencrypt"
      - "traefik.http.routers.server-secure.middlewares=api-ratelimit-ip,api-ratelimit-subnet"
      
      # Service definition
      - "traefik.http.services.server.loadbalancer.server.port=3000"
    env_file:
      - .env

  minio:
    image: minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio-data:/data
    networks:
      - proxy
      - internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      
      # Per-IP Rate limiting middleware for storage
      - "traefik.http.middlewares.storage-ratelimit-ip.ratelimit.average=${TRAEFIK_RATE_LIMIT_AVERAGE:-100}"
      - "traefik.http.middlewares.storage-ratelimit-ip.ratelimit.period=${TRAEFIK_RATE_LIMIT_PERIOD:-1m}"
      - "traefik.http.middlewares.storage-ratelimit-ip.ratelimit.burst=${TRAEFIK_RATE_LIMIT_BURST:-50}"
      - "traefik.http.middlewares.storage-ratelimit-ip.ratelimit.sourceCriterion.requestHeaderName=X-Forwarded-For"
      
      # Per-Subnet Rate limiting middleware for storage
      - "traefik.http.middlewares.storage-ratelimit-subnet.ratelimit.average=${TRAEFIK_SUBNET_RATE_LIMIT_AVERAGE:-150}"
      - "traefik.http.middlewares.storage-ratelimit-subnet.ratelimit.period=${TRAEFIK_SUBNET_RATE_LIMIT_PERIOD:-1m}"
      - "traefik.http.middlewares.storage-ratelimit-subnet.ratelimit.burst=${TRAEFIK_SUBNET_RATE_LIMIT_BURST:-50}"
      - "traefik.http.middlewares.storage-ratelimit-subnet.ratelimit.sourceCriterion.ipStrategy.depth=1"
      
      # minio API HTTP router (redirects to HTTPS)
      - "traefik.http.routers.minio-api.rule=Host(`storage.ammerli.com`)"
      - "traefik.http.routers.minio-api.entrypoints=web"
      
      # minio API HTTPS router with both rate limiters
      - "traefik.http.routers.minio-api-secure.rule=Host(`storage.ammerli.com`)"
      - "traefik.http.routers.minio-api-secure.entrypoints=websecure"
      - "traefik.http.routers.minio-api-secure.tls=true"
      - "traefik.http.routers.minio-api-secure.tls.certresolver=letsencrypt"
      - "traefik.http.routers.minio-api-secure.middlewares=storage-ratelimit-ip,storage-ratelimit-subnet"
      - "traefik.http.routers.minio-api-secure.service=minio-api-svc"
      
      # Service definition
      - "traefik.http.services.minio-api-svc.loadbalancer.server.port=9000"

  redis:
    image: redis:latest
    container_name: redis
    restart: unless-stopped
    networks:
      - internal
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  db:
    image: postgres
    container_name: db
    restart: unless-stopped
    ports:
      - "5432:5432"
    user: postgres
    env_file:
      - .env
    volumes:
      - db-data:/var/lib/postgresql
    networks:
      - internal
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  db-backup:
    image: prodrigestivill/postgres-backup-local
    container_name: db-backup
    restart: unless-stopped
    depends_on:
      - db
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - SCHEDULE=@daily
      - BACKUP_KEEP_DAYS=4
    volumes:
      - backups:/backups
    networks:
      - internal


  loki:
    image: grafana/loki:2.9.3
    container_name: loki
    ports:
      - "3100:3100"
    volumes:
      - ./loki-config.yml:/etc/loki/loki-config.yml
      - loki-data:/loki
    command: -config.file=/etc/loki/loki-config.yml
    networks:
      - proxy 
      - internal 
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.2.3
    container_name: grafana
    depends_on:
      - loki
    ports:
      - "3001:3001"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./traefik/provisioning/grafana:/etc/grafana/provisioning
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=https://grafana.ammerli.com
      - GF_SERVER_DOMAIN=grafana.ammerli.com
    networks:
      - proxy
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.middlewares.grafana-auth.basicauth.users=${GRAFANA_TRAEFIK_AUTH}"
      # Rate limiting for Grafana
      - "traefik.http.middlewares.grafana-ratelimit.ratelimit.average=50"
      - "traefik.http.middlewares.grafana-ratelimit.ratelimit.period=1m"
      - "traefik.http.middlewares.grafana-ratelimit.ratelimit.burst=25"
      # HTTP router (redirect to HTTPS)
      - "traefik.http.routers.grafana.rule=Host(`grafana.ammerli.com`)"
      - "traefik.http.routers.grafana.entrypoints=web"
      - "traefik.http.routers.grafana.middlewares=https-redirect@file"
      # HTTPS router with security middlewares
      - "traefik.http.routers.grafana-secure.rule=Host(`grafana.ammerli.com`)"
      - "traefik.http.routers.grafana-secure.entrypoints=websecure"
      - "traefik.http.routers.grafana-secure.tls=true"
      - "traefik.http.routers.grafana-secure.tls.certresolver=letsencrypt"
      - "traefik.http.routers.grafana-secure.middlewares=grafana-ratelimit,grafana-auth"
      # Service definition
      - "traefik.http.services.grafana.loadbalancer.server.port=3001"
    restart: unless-stopped

networks:
  proxy:
    name: proxy
    driver: bridge
  internal:
    name: internal
    driver: bridge
    internal: true 

volumes:
  minio-data:
    driver: local
  db-data:
    driver: local
  backups:
    driver: local
  loki-data:
    driver: local
  grafana-data:
    driver: local
