config:
  target: "http://localhost:3000"
  phases:
    # Simulate realistic daily traffic pattern
    - duration: 60
      arrivalRate: 20
      name: "Morning traffic"
    - duration: 180
      arrivalRate: 50
      name: "Peak morning hours"
    - duration: 120
      arrivalRate: 30
      name: "Afternoon steady"
    - duration: 180
      arrivalRate: 70
      name: "Peak evening hours"
    - duration: 60
      arrivalRate: 10
      name: "Evening wind down"
  
  ensure:
    maxErrorRate: 2
    p95: 800
    p99: 2000

scenarios:
  # Realistic mix of user behaviors
  - name: "Guest User - Browse Products"
    weight: 40  # 40% of traffic
    flow:
      # Browse products
      - get:
          url: "/products?page={{ $randomInt(1, 5) }}&limit=20"
          expect:
            - statusCode: 200
      
      - think: 3
      
      # View product details
      - get:
          url: "/products/{{ $randomInt(1, 100) }}"
          expect:
            - statusCode:
                - 200
                - 404
      
      - think: 5

  - name: "Supermarket - Browse and Order"
    weight: 25  # 25% of traffic
    flow:
      # Login
      - post:
          url: "/authentication/login"
          json:
            phoneNumber: "+213555200{{ $randomInt(1, 5) }}"
            password: "supermarketPassword"
          capture:
            - json: "$.accessToken"
              as: "token"
      
      # Browse products
      - get:
          url: "/products?page=1&limit=20"
          expect:
            - statusCode: 200
      
      - think: 4
      
      # View details
      - get:
          url: "/products/{{ $randomInt(1, 50) }}"
          expect:
            - statusCode:
                - 200
                - 404
      
      - think: 5
      
      # Create order (30% of logged-in users make an order)
      - post:
          url: "/orders"
          headers:
            Authorization: "Bearer {{ token }}"
          json:
            items:
              - productId: "{{ $randomInt(1, 50) }}"
                quantity: "{{ $randomInt(1, 5) }}"
            addressId: 1
            paymentMethod: "{{ $pick('CASH_ON_DELIVERY', 'ONLINE') }}"
          expect:
            - statusCode:
                - 201
                - 400
      
      - think: 2

  - name: "Supermarket - Check Orders"
    weight: 15  # 15% of traffic
    flow:
      # Login
      - post:
          url: "/authentication/login"
          json:
            phoneNumber: "+213555200{{ $randomInt(1, 5) }}"
            password: "supermarketPassword"
          capture:
            - json: "$.accessToken"
              as: "token"
      
      # View orders
      - get:
          url: "/orders?page=1&limit=10"
          headers:
            Authorization: "Bearer {{ token }}"
          expect:
            - statusCode: 200
      
      - think: 5

  - name: "Wholesaler - Manage Products and Orders"
    weight: 10  # 10% of traffic
    flow:
      # Login
      - post:
          url: "/authentication/login"
          json:
            phoneNumber: "+213555100{{ $randomInt(1, 3) }}"
            password: "wholesalerPassword"
          capture:
            - json: "$.accessToken"
              as: "token"
      
      # Check orders
      - get:
          url: "/orders?status=CONFIRMATION&page=1&limit=10"
          headers:
            Authorization: "Bearer {{ token }}"
          expect:
            - statusCode: 200
      
      - think: 3
      
      # View own products
      - get:
          url: "/products?page=1&limit=20"
          headers:
            Authorization: "Bearer {{ token }}"
          expect:
            - statusCode: 200
      
      - think: 5

  - name: "New User - Authentication Flow"
    weight: 5  # 5% of traffic
    flow:
      # Send OTP
      - post:
          url: "/authentication/send-otp"
          json:
            phoneNumber: "+213{{ $randomInt(555000000, 555999999) }}"
          expect:
            - statusCode: 200
      
      - think: 3

  - name: "Payment Webhooks"
    weight: 5  # 5% of traffic
    flow:
      # Chargily webhook
      - post:
          url: "/payment/webhook"
          headers:
            Content-Type: "application/json"
          json:
            id: "{{ $randomString(20) }}"
            type: "payment"
            event: "payment.success"
            data:
              id: "{{ $randomString(15) }}"
              status: "paid"
              amount: "{{ $randomInt(1000, 50000) }}"
              metadata:
                orderId: "{{ $randomInt(1, 1000) }}"
          expect:
            - statusCode:
                - 200
                - 400
      
      - think: 1

before:
  flow:
    - log: "Starting Mixed Load Test - Simulating Real User Traffic"

after:
  flow:
    - log: "Mixed Load Test Completed"
