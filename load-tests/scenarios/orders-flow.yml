config:
  target: "http://localhost:3000"
  phases:
    # Warm-up
    - duration: 30
      arrivalRate: 5
      name: "Warm up"
    # Normal ordering
    - duration: 180
      arrivalRate: 10
      name: "Normal ordering"
    # Peak ordering (rush hours)
    - duration: 120
      arrivalRate: 20
      name: "Peak ordering"
    # Ramp down
    - duration: 30
      arrivalRate: 5
      name: "Ramp down"
  
  ensure:
    maxErrorRate: 2  # Orders can have more complexity
    p95: 1000        # Orders take longer (database writes)
    p99: 2000

scenarios:
  - name: "Supermarket - Create Order"
    weight: 3
    flow:
      # Login as supermarket
      - post:
          url: "/authentication/login"
          json:
            phoneNumber: "+213555200001"  # Supermarket test account
            password: "supermarketPassword"
          capture:
            - json: "$.accessToken"
              as: "token"
          expect:
            - statusCode: 200
      
      # Think time (browsing products)
      - think: 3
      
      # Create order
      - post:
          url: "/orders"
          headers:
            Authorization: "Bearer {{ token }}"
          json:
            items:
              - productId: "{{ $randomInt(1, 50) }}"
                quantity: "{{ $randomInt(1, 10) }}"
              - productId: "{{ $randomInt(51, 100) }}"
                quantity: "{{ $randomInt(1, 5) }}"
            addressId: "{{ $randomInt(1, 3) }}"
            paymentMethod: "CASH_ON_DELIVERY"
          expect:
            - statusCode:
                - 201
                - 400  # Validation or stock errors
          capture:
            - json: "$.id"
              as: "orderId"
      
      # Think time
      - think: 2

  - name: "Supermarket - View Orders"
    weight: 2
    flow:
      # Login
      - post:
          url: "/authentication/login"
          json:
            phoneNumber: "+213555200001"
            password: "supermarketPassword"
          capture:
            - json: "$.accessToken"
              as: "token"
      
      # Get orders list
      - get:
          url: "/orders?page=1&limit=20"
          headers:
            Authorization: "Bearer {{ token }}"
          expect:
            - statusCode: 200
          capture:
            - json: "$.data[0].id"
              as: "orderId"
      
      # Think time
      - think: 2
      
      # Get specific order details
      - get:
          url: "/orders/{{ orderId }}"
          headers:
            Authorization: "Bearer {{ token }}"
          expect:
            - statusCode:
                - 200
                - 404

  - name: "Wholesaler - Update Order Status"
    weight: 1
    flow:
      # Login as wholesaler
      - post:
          url: "/authentication/login"
          json:
            phoneNumber: "+213555100001"
            password: "wholesalerPassword"
          capture:
            - json: "$.accessToken"
              as: "token"
      
      # Get pending orders
      - get:
          url: "/orders?status=CONFIRMATION&page=1&limit=10"
          headers:
            Authorization: "Bearer {{ token }}"
          expect:
            - statusCode: 200
          capture:
            - json: "$.data[0].id"
              as: "orderId"
      
      # Think time (reviewing order)
      - think: 5
      
      # Update order status
      - patch:
          url: "/orders/{{ orderId }}/status"
          headers:
            Authorization: "Bearer {{ token }}"
          json:
            status: "PREPARATION"
          expect:
            - statusCode:
                - 200
                - 404
                - 400

  - name: "Supermarket - Cancel Order"
    weight: 1
    flow:
      # Login
      - post:
          url: "/authentication/login"
          json:
            phoneNumber: "+213555200001"
            password: "supermarketPassword"
          capture:
            - json: "$.accessToken"
              as: "token"
      
      # Get orders
      - get:
          url: "/orders?page=1&limit=10"
          headers:
            Authorization: "Bearer {{ token }}"
          capture:
            - json: "$.data[0].id"
              as: "orderId"
      
      # Think time
      - think: 3
      
      # Cancel order
      - delete:
          url: "/orders/{{ orderId }}"
          headers:
            Authorization: "Bearer {{ token }}"
          expect:
            - statusCode:
                - 200
                - 404
                - 400

before:
  flow:
    - log: "Starting Orders Load Test"

after:
  flow:
    - log: "Orders Load Test Completed"
