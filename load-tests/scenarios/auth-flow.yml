config:
  target: "http://localhost:3000"
  phases:
    # Warm-up phase
    - duration: 30
      arrivalRate: 5
      name: "Warm up"
    # Normal load
    - duration: 120
      arrivalRate: 10
      name: "Normal load"
    # Peak load
    - duration: 180
      arrivalRate: 20
      name: "Peak load"
    # Ramp down
    - duration: 30
      arrivalRate: 5
      name: "Ramp down"
  
  # Performance thresholds
  ensure:
    maxErrorRate: 1  # Max 1% error rate
    p95: 500         # 95th percentile should be under 500ms
    p99: 1000        # 99th percentile should be under 1000ms

  # Load test settings
  # Uncomment to use CSV data
  # payload:
  #   path: "./load-tests/data/phone-numbers.csv"
  #   fields:
  #     - "phoneNumber"
  #   order: "sequence"

scenarios:
  - name: "Authentication Flow - Send OTP"
    weight: 1
    flow:
      # Send OTP request
      - post:
          url: "/api/v1/authentication/otp/send"
          json:
            phoneNumber: "+213{{ $randomInt(555000000, 555999999) }}"
          capture:
            - json: "$.message"
              as: "otpMessage"
          expect:
            - statusCode: 200
            - contentType: json
            - hasProperty: message

      
      # Think time (simulate user delay)
      - think: 2

  - name: "Authentication Flow - Verify OTP"
    weight: 1
    flow:
      # First send OTP
      - post:
          url: "/api/v1/authentication/otp/send"
          json:
            phoneNumber: "+213555000001"
          expect:
            - statusCode: 200
      
      # Wait for OTP (in real scenario, user receives SMS)
      - think: 3
      
      # Verify OTP (using test OTP code)
      - post:
          url: "/api/v1/authentication/otp/validate"
          json:
            phoneNumber: "+213555000001"
            otp: "123456"  # Test OTP - configure in your backend for testing
          capture:
            - json: "$.accessToken"
              as: "accessToken"
          expect:
            - statusCode: 200
            - hasProperty: accessToken
      
      # Think time
      - think: 1

  - name: "Authentication Flow - Login with JWT"
    weight: 1
    flow:
      # Login request (assumes user already has account)
      - post:
          url: "/api/v1/authentication/otp/send"
          json:
            phoneNumber: "+213555000001"
            password: "testPassword123"
          capture:
            - json: "$.accessToken"
              as: "token"
          expect:
            - statusCode: 200
            - hasProperty: accessToken
      
      # Think time
      - think: 2
      
      # Verify token works by getting user info
      - get:
          url: "/api/v1/user/me"
          headers:
            Authorization: "Bearer {{ token }}"
          expect:
            - statusCode:
                - 200
                - 401

# Custom functions for logging
before:
  flow:
    - log: "Starting Authentication Load Test"

after:
  flow:
    - log: "Authentication Load Test Completed"
