# API Endpoints Configuration
# Base URLs for different environments
config:
  target: "http://localhost:3000"
  environments:
    local:
      target: "http://localhost:3000"
    dev:
      target: "http://your-dev-server.com"
    prod:
      target: "http://your-prod-server.com"
  
  # Default headers for all requests
  defaults:
    headers:
      Content-Type: "application/json"
      Accept: "application/json"

# Test phone numbers for load testing (should be test accounts)
testData:
  phoneNumbers:
    - "+213555000001"
    - "+213555000002"
    - "+213555000003"
    - "+213555000004"
    - "+213555000005"
  
  # Test OTP codes (if using test mode)
  testOtp: "123456"
