# Simplified configuration inspired by the user's previous setup.
# NOTE: The global redirect has been intentionally omitted to prevent ACME failures.

api:
  dashboard: true
  insecure: true # Exposes the dashboard on port 8080

entryPoints:
  web:
    address: ":80"

  websecure:
    address: ":443"
    http:
      tls:
        certResolver: letsencrypt

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: proxy
    watch: true

  file:
    filename: /config.yml
    watch: true

log:
  level: INFO

accessLog: {} # Logs to stdout

certificatesResolvers:
  letsencrypt:
    acme:
      email: zaki@ammerli.com
      storage: /acme.json
      httpChallenge:
        entryPoint: web