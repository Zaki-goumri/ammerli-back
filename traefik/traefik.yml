# Main Traefik configuration

api:
  dashboard: true
  insecure: true # Exposes the dashboard on port 8080

entryPoints:
  web:
    address: ":80"
  websecure:
    address: ":443"
    http:
      tls:
        certResolver: letsencrypt

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: proxy
    watch: true

log:
  level: INFO

accessLog: {} # Logs to stdout

certificatesResolvers:
  letsencrypt:
    acme:
      email: zaki@ammerli.com
      storage: /acme.json
      httpChallenge:
        entryPoint: web

# ==============================================
# MIDDLEWARES
# ==============================================
http:
  middlewares:
    security-headers:
      headers:
        frameDeny: true
        browserXssFilter: true
        contentTypeNosniff: true
        forceSTSHeader: true
        stsIncludeSubdomains: true
        stsPreload: true
        stsSeconds: 31536000
        customFrameOptionsValue: "SAMEORIGIN"
        customRequestHeaders:
          X-Forwarded-Proto: "https"
          
    https-redirect:
      redirectScheme:
        scheme: https
        permanent: true